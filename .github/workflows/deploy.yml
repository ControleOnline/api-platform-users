# Single deploy pipeline for dev / staging / master (production).
# Mirrors api-community env mapping; deploys only the users module.
name: Deploy

on:
  push:
    branches: [dev, staging, master]
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [dev, staging, master]

concurrency:
  group: deploy-users-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  configure:
    name: "1 · Configure environment"
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set.outputs.env }}
      branch: ${{ steps.set.outputs.branch }}
      module_path: ${{ steps.set.outputs.module_path }}
      app_path: ${{ steps.set.outputs.app_path }}
      auth_mode: ${{ steps.set.outputs.auth_mode }}
    steps:
      - name: Map branch → environment config
        id: set
        run: |
          set -e
          REF="${{ github.event.inputs.target || github.ref_name }}"
          case "$REF" in
            dev)
              ENV=dev; BRANCH=dev
              MODULE_PATH=/var/www/api-community-dev/modules/controleonline/users
              APP_PATH=/var/www/api-community-dev
              AUTH_MODE=password
              ;;
            staging)
              ENV=staging; BRANCH=staging
              MODULE_PATH=/var/www/api-community/modules/controleonline/users
              APP_PATH=/var/www/api-community
              AUTH_MODE=password
              ;;
            master)
              ENV=master; BRANCH=master
              MODULE_PATH='$HOME/sistemas/controleonline/api/modules/controleonline/users'
              APP_PATH='$HOME/sistemas/controleonline/api'
              AUTH_MODE=key
              ;;
            *)
              echo "Unsupported target: $REF (expected dev|staging|master)"
              exit 1
              ;;
          esac
          {
            echo "env=$ENV"
            echo "branch=$BRANCH"
            echo "module_path=$MODULE_PATH"
            echo "app_path=$APP_PATH"
            echo "auth_mode=$AUTH_MODE"
          } >> "$GITHUB_OUTPUT"
          echo "Configured: env=$ENV branch=$BRANCH module=$MODULE_PATH auth=$AUTH_MODE"

  deploy:
    name: "2 · Deploy users (${{ needs.configure.outputs.env }})"
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets for environment
        run: |
          set -e
          ENV="${{ needs.configure.outputs.env }}"
          case "$ENV" in
            dev|staging)
              # Org secrets used for password SSH (staging/dev host)
              test -n "${{ secrets.HOST }}" || { echo "Missing org secret HOST"; exit 1; }
              test -n "${{ secrets.USER }}" || { echo "Missing org secret USER"; exit 1; }
              test -n "${{ secrets.PASS }}" || { echo "Missing org secret PASS"; exit 1; }
              ;;
            master)
              test -n "${{ secrets.API_HOST }}" || { echo "Missing org secret API_HOST"; exit 1; }
              test -n "${{ secrets.USER }}" || { echo "Missing org secret USER"; exit 1; }
              test -n "${{ secrets.CONTROLEONLINE }}" || { echo "Missing org secret CONTROLEONLINE (SSH key)"; exit 1; }
              ;;
          esac

      - name: Deploy module over SSH (password — dev/staging)
        if: needs.configure.outputs.auth_mode == 'password'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          port: ${{ secrets.PORT || 22 }}
          script_stop: true
          envs: BRANCH,MODULE_PATH,APP_PATH
          script: |
            set -e
            BRANCH="${{ needs.configure.outputs.branch }}"
            MODULE_PATH="${{ needs.configure.outputs.module_path }}"
            APP_PATH="${{ needs.configure.outputs.app_path }}"
            test -d "$MODULE_PATH" || { echo "Module path missing: $MODULE_PATH"; exit 1; }
            cd "$MODULE_PATH"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "Deployed $(git log -1 --oneline) on $BRANCH"
            cd "$APP_PATH"
            php bin/console cache:clear --env=prod 2>/dev/null || php bin/console cache:clear

      - name: Deploy module over SSH (key — production/master)
        if: needs.configure.outputs.auth_mode == 'key'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.CONTROLEONLINE }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e
            BRANCH=master
            MODULE_PATH="$HOME/sistemas/controleonline/api/modules/controleonline/users"
            APP_PATH="$HOME/sistemas/controleonline/api"
            test -d "$MODULE_PATH" || { echo "Module path missing: $MODULE_PATH"; exit 1; }
            cd "$MODULE_PATH"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "Deployed $(git log -1 --oneline) on $BRANCH"
            cd "$APP_PATH"
            php bin/console cache:clear --env=prod 2>/dev/null || php bin/console cache:clear
