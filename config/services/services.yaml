services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true
    ControleOnline\:
        resource: '../../src/*'
        exclude: '../../src/{DependencyInjection,Entity,Resource,Migrations,Library,Message,Tests,Kernel.php}'
    ControleOnline\Repository\:
        resource: '../../src/Repository'
        tags: ['doctrine.repository_service']
    ControleOnline\Controller\:
        resource: '../../src/Controller'
        tags: ['controller.service_arguments']
    ControleOnline\Command\:
        resource: '../../src/Command'
        tags: ['console.command']
    ControleOnline\Filter\:
        resource: '../../src/Filter'
    ControleOnline\Service\OAuthService:
        arguments:
            $secret: '%kernel.secret%'
            $issuer: '%env(APP_DOMAIN)%'
            $allowedScopes: ['mcp:read']
            $cache: '@cache.app'
            $lockFactory: '@lock.factory'
            $defaultScopes: ['mcp:read']
    ControleOnline\EventListener\OAuthTenantRequestListener:
        tags:
            # MultiTenancy's DatabaseSwitchListener runs at priority 512.
            - { name: 'kernel.event_listener', event: 'kernel.request', method: 'onKernelRequest', priority: 1024 }
